name: Build Custom Android ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [ "fix/coloros-recents-lock" ]

env:
  FLUTTER_VERSION: '3.50.1'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  android-arm64:
    name: Android ARM64 Custom APK
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite submodule SSH URLs to HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Install Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Android ARM64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart tool/package.dart android --arch arm64 --env stable -v

      - name: Verify APK output
        run: |
          ls -lh ./dist/
          ls ./dist/*.apk

      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: flclash-custom-android-arm64
          path: ./dist/*.apk
          if-no-files-found: error
